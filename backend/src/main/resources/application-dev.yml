spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stocksight?serverTimezone=UTC}
    username: ${DB_USERNAME:stocksight}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
